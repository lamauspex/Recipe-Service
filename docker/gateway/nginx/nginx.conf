events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ==========================================
    # Upstream definitions
    # ==========================================
    upstream user_service {
        server service_user:8000;
    }

    upstream recipe_service {
        server service_recipe:8000;  
    }

    upstream search_service {
        server service_search:8002;
    }

    upstream frontend {
        server frontend:80;
    }

    # ==========================================
    # Server configuration
    # ==========================================
    server {
        listen 80;
        server_name localhost;

        # ==========================================
        # FRONTEND — прокси на отдельный контейнер
        # ==========================================
        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Anti-cache для разработки
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # ==========================================
        # service_user - API endpoints
        # ==========================================
        location /api/v1/auth/ {
            proxy_pass http://user_service/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # service_user - Register API
        location /api/v1/register/ {
            proxy_pass http://user_service/api/v1/register/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # service_user - Swagger UI
        location /user-docs {
            proxy_pass http://user_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_user - Redoc
        location /user-redoc {
            proxy_pass http://user_service/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_user - Health
        location /user-health {
            proxy_pass http://user_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_user - Health (с trailing slash для совместимости)
        location /user-health/ {
            proxy_pass http://user_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # service_recipe - API endpoints
        # ==========================================
        location /api/v1/recipes/ {
            proxy_pass http://recipe_service/api/v1/recipes/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # service_recipe - Health
        location /recipe-health {
            proxy_pass http://recipe_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_recipe - Health (с trailing slash для совместимости)
        location /recipe-health/ {
            proxy_pass http://recipe_service/api/v1/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_recipe - Swagger UI
        location /recipe-docs {
            proxy_pass http://recipe_service/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # service_recipe - Redoc
        location /recipe-redoc {
            proxy_pass http://recipe_service/redoc;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # service_search - Search API
        # ==========================================
        location /api/v1/search {
            proxy_pass http://search_service/api/v1/search;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # service_search - Health
        location /search-health {
            proxy_pass http://search_service/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ==========================================
        # Nginx health check (используем wget, не curl!)
        # ==========================================
        location /nginx-health {
            access_log off;
            return 200 "Nginx OK\n";
            add_header Content-Type text/plain;
        }
    }
}
