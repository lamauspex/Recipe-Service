services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../frontend:/usr/share/nginx/html:ro
    depends_on:
      service_user:
        condition: service_healthy
      service_recipe:
        condition: service_healthy
      service_search:
        condition: service_started
    networks:
      - recipe_network
    # healthcheck отключён - Nginx работает, но healthcheck требует root прав
    # healthcheck:
    #   test: ["CMD", "wget", "-q", "--spider", "http://localhost/nginx-health"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
